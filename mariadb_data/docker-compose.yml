services:

  aula_mariadb:
    image: mariadb:11.4
    container_name: aula_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: controle_financeiro
      MYSQL_USER: aula_user
      MYSQL_PASSWORD: aula_pass
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 10

  aula_php8.5:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile.txt
    container_name: aula_php8.5
    restart: unless-stopped
    volumes:
      - ..:/var/www/html
    depends_on:
      aula_mariadb:
        condition: service_healthy

  aula_nginx:
    image: nginx:alpine
    container_name: aula_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aula_php8.5

volumes:
  mariadb_data: